<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course — Applied AI in Design Thinking (Creative Problem Solving)</title>
  <style>
    :root {
      --bg:#0f172a; --surface:#fff; --ink:#1e293b; --muted:#64748b;
      --primary:#2563eb; --accent:#ea580c; --line:#e2e8f0;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--ink); line-height:1.6;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(160deg,#1e293b,#0f172a); min-height:100vh; padding:24px 16px;
    }
    .shell { max-width:880px; margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin:0 auto 18px;
      max-width:880px; }
    .topbar a { color:#cbd5e1; text-decoration:none; font-size:.9rem; }
    .topbar a:hover { color:#fff; }
    header.course { background:var(--surface); border-radius:16px 16px 0 0; padding:28px 32px 20px;
      box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .eyebrow { margin:0; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
      color:var(--accent); font-weight:700; }
    h1.course-title { margin:4px 0 8px; font-size:1.7rem; }
    .course-sub { margin:0; color:var(--muted); }
    main.modules { background:var(--surface); border-radius:0 0 16px 16px; padding:8px 32px 32px;
      box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .module { padding:20px 0; border-top:1px solid var(--line); }
    .module:first-child { border-top:none; }
    .module h2 { margin:0 0 2px; font-size:1.2rem; }
    .module__blurb { margin:0 0 12px; color:var(--muted); font-size:.95rem; }
    .lessons { display:grid; gap:10px; }
    a.lesson-card { display:block; text-decoration:none; color:inherit; border:1px solid var(--line);
      border-radius:12px; padding:12px 16px; transition:border-color .15s, transform .05s; }
    a.lesson-card:hover { border-color:var(--primary); transform:translateY(-1px); }
    .lesson-card__title { font-weight:700; color:var(--primary); }
    .lesson-card__blurb { margin:2px 0 0; color:var(--ink); font-size:.92rem; }
    .module--planned { opacity:.7; }
    .badge { display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.05em; background:#f1f5f9; color:var(--muted); border-radius:999px;
      padding:2px 8px; margin-left:8px; vertical-align:middle; }
    .status { color:var(--muted); padding:30px 0; text-align:center; }
    @media (max-width:560px){ header.course,main.modules{padding-left:18px;padding-right:18px;} }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../../index.html">← AWID Classes</a>
    <a href="LESSON-SPEC.md">For instructors / authors →</a>
  </div>
  <div class="shell">
    <header class="course">
      <p class="eyebrow">Self-paced course</p>
      <h1 class="course-title" id="courseTitle">Applied AI in Design Thinking</h1>
      <p class="course-sub">Creative Problem Solving — browse the modules and open any lesson.</p>
    </header>
    <main class="modules" id="modules"><p class="status">Loading lessons…</p></main>
  </div>

  <script>
  (function () {
    "use strict";
    var modulesEl = document.getElementById("modules");

    fetch("lessons.json")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        if (data.course) document.getElementById("courseTitle").textContent = data.course.replace(/\s*\(.*\)\s*/, "");
        modulesEl.innerHTML = "";
        (data.modules || []).forEach(function (m) { modulesEl.appendChild(renderModule(m, false)); });
        (data.planned || []).forEach(function (m) { modulesEl.appendChild(renderModule(m, true)); });
      })
      .catch(function (e) {
        modulesEl.innerHTML = '<p class="status">Could not load the lesson list (' + e.message +
          ').<br>Serve this folder with a local web server and reload.</p>';
      });

    function renderModule(m, planned) {
      var sec = document.createElement("section");
      sec.className = "module" + (planned ? " module--planned" : "");
      var h = document.createElement("h2");
      h.textContent = m.title;
      if (planned) { var b = document.createElement("span"); b.className = "badge"; b.textContent = "Coming soon"; h.appendChild(b); }
      sec.appendChild(h);
      if (m.blurb) { var p = document.createElement("p"); p.className = "module__blurb"; p.textContent = m.blurb; sec.appendChild(p); }
      var list = document.createElement("div");
      list.className = "lessons";
      (m.lessons || []).forEach(function (lesson) {
        var a = document.createElement("a");
        a.className = "lesson-card";
        a.href = "view.html?lesson=" + encodeURIComponent(m.id + "/" + lesson.slug);
        var t = document.createElement("div"); t.className = "lesson-card__title"; t.textContent = lesson.title;
        a.appendChild(t);
        if (lesson.blurb) { var bl = document.createElement("p"); bl.className = "lesson-card__blurb"; bl.textContent = lesson.blurb; a.appendChild(bl); }
        list.appendChild(a);
      });
      sec.appendChild(list);
      return sec;
    }
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson Viewer · Creative Problem Solving</title>
  <style>
    :root {
      --bg:#0f172a; --surface:#fff; --ink:#1e293b; --muted:#64748b;
      --primary:#2563eb; --accent:#ea580c; --line:#e2e8f0; --code:#f1f5f9;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; color:var(--ink); line-height:1.65;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(160deg,#1e293b,#0f172a); min-height:100vh; padding:24px 16px;
    }
    .shell { max-width:1080px; margin:0 auto; background:var(--surface);
      border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.35);
      display:grid; grid-template-columns:248px minmax(0,1fr); }
    .main { min-width:0; border-radius:0 16px 16px 0; overflow:hidden; }
    header { padding:24px 32px 0; position:relative; }
    .nav-toggle { display:none; font:inherit; cursor:pointer; color:var(--ink);
      border:1px solid var(--line); background:#fff; border-radius:8px;
      width:40px; height:36px; font-size:1.15rem; line-height:1; margin-bottom:10px; }
    .course-nav { background:#f8fafc; border-right:1px solid var(--line);
      border-radius:16px 0 0 16px; }
    .course-nav__inner { position:sticky; top:0; max-height:100vh; overflow:auto;
      padding:20px 14px 24px; }
    .course-nav__eyebrow { margin:0 0 12px; padding:0 8px; font-size:.72rem; letter-spacing:.08em;
      text-transform:uppercase; color:var(--muted); font-weight:700; }
    .course-nav__mod { margin:14px 0 4px; padding:0 8px; font-size:.8rem; font-weight:700;
      color:var(--ink); }
    .course-nav__mod:first-child { margin-top:0; }
    .course-nav a { display:block; padding:7px 10px; margin:1px 0; border-radius:8px;
      color:var(--ink); text-decoration:none; font-size:.9rem; line-height:1.35;
      border-left:3px solid transparent; }
    .course-nav a:hover { background:#eef2f7; }
    .course-nav a.is-current { background:#eff6ff; color:var(--primary); font-weight:600;
      border-left-color:var(--primary); }
    .course-nav__soon { display:block; padding:5px 10px; font-size:.86rem; color:var(--muted);
      font-style:italic; }
    .course-nav__pill { display:inline-block; margin-left:8px; font-size:.62rem; font-weight:700;
      letter-spacing:.04em; text-transform:uppercase; color:var(--muted); vertical-align:middle;
      border:1px solid var(--line); border-radius:999px; padding:1px 6px; }
    .nav-backdrop { display:none; }
    .eyebrow { margin:0; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
      color:var(--accent); font-weight:700; }
    h1.viewer-title { margin:4px 0 16px; font-size:1.5rem; }
    nav.tabs { display:flex; flex-wrap:wrap; gap:8px; border-bottom:1px solid var(--line);
      padding:0 32px; }
    .tab { font:inherit; font-weight:600; border:none; background:none; cursor:pointer;
      padding:12px 6px; margin-right:10px; color:var(--muted); border-bottom:3px solid transparent; }
    .tab:hover { color:var(--ink); }
    .tab.is-active { color:var(--primary); border-bottom-color:var(--primary); }
    .tab--launch { margin-left:auto; color:#fff; background:var(--accent); border-radius:999px;
      padding:8px 16px; align-self:center; border-bottom:none; text-decoration:none; }
    .tab--launch:hover { filter:brightness(1.05); }
    .tab--all { background:transparent; color:var(--primary); border:1px solid var(--line); }
    .tab--all:hover { background:#f1f5f9; filter:none; }
    article { padding:8px 32px 36px; }
    article h1 { font-size:1.7rem; }
    article h2 { font-size:1.3rem; margin-top:1.6em; }
    article h3 { font-size:1.1rem; }
    article hr { border:none; border-top:1px solid var(--line); margin:1.8em 0; }
    article blockquote { margin:1em 0; padding:10px 16px; border-left:4px solid var(--accent);
      background:#fff7ed; border-radius:0 8px 8px 0; }
    article code { background:var(--code); padding:.12em .4em; border-radius:5px; font-size:.9em; }
    article pre { background:#0f172a; color:#e2e8f0; padding:14px 16px; border-radius:10px;
      overflow:auto; }
    article pre code { background:none; color:inherit; padding:0; }
    article table { border-collapse:collapse; width:100%; margin:1em 0; }
    article th, article td { border:1px solid var(--line); padding:8px 10px; text-align:left;
      vertical-align:top; }
    article th { background:#f8fafc; }
    .status { color:var(--muted); padding:40px 0; text-align:center; }
    .status.error { color:#b91c1c; }
    footer { padding:0 32px 24px; color:var(--muted); font-size:.85rem; }
    @media (max-width:860px){
      .shell { display:block; max-width:600px; }
      .main { border-radius:16px; }
      .nav-toggle { display:inline-flex; align-items:center; justify-content:center; }
      .course-nav { position:fixed; top:0; left:0; bottom:0; width:284px; z-index:50;
        border-radius:0; border-right:1px solid var(--line);
        transform:translateX(-100%); transition:transform .22s ease;
        box-shadow:0 10px 40px rgba(0,0,0,.4); }
      .shell.nav-open .course-nav { transform:none; }
      .shell.nav-open .nav-backdrop { display:block; position:fixed; inset:0; z-index:40;
        background:rgba(15,23,42,.5); }
    }
    @media (max-width:560px){ header,nav.tabs,article,footer{padding-left:18px;padding-right:18px;} }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="course-nav" id="courseNav" aria-label="Course navigation">
      <div class="course-nav__inner">
        <p class="course-nav__eyebrow">Course</p>
        <div id="navTree"></div>
      </div>
    </aside>
    <div class="nav-backdrop" id="navBackdrop"></div>
    <div class="main">
      <header>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Open course navigation" aria-expanded="false">☰</button>
        <p class="eyebrow" id="eyebrow">Creative Problem Solving</p>
        <h1 class="viewer-title" id="title">Lesson Viewer</h1>
      </header>
      <nav class="tabs" id="tabs"></nav>
      <article id="content"><p class="status">Loading…</p></article>
      <footer>
        Rendered from the lesson's source Markdown. If you see a load error, serve this folder
        (e.g. <code>python3 -m http.server</code>) instead of opening the file directly.
      </footer>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // ?lesson=<folder>  (default = Module 0). Parts live in <folder>/<part>.md
    var params = new URLSearchParams(location.search);
    var LESSON = params.get("lesson") || "module-0-framing/1-its-not-magic";
    var INSTRUCTOR = params.get("instructor") === "1";
    var PARTS = [
      { key: "lesson-text", label: "Lesson" },
      { key: "activity",    label: "Activity" }
    ];
    // Instructor guides contain answer keys — only shown with ?instructor=1 (not for students).
    if (INSTRUCTOR) PARTS.push({ key: "instructor-guide", label: "Instructor Guide" });

    var tabsEl = document.getElementById("tabs");
    var contentEl = document.getElementById("content");

    // Build tabs
    PARTS.forEach(function (p) {
      var b = document.createElement("button");
      b.className = "tab"; b.textContent = p.label; b.dataset.key = p.key;
      b.addEventListener("click", function () { load(p.key); });
      tabsEl.appendChild(b);
    });
    // Right cluster: All-lessons link and the interactive launch.
    var allLink = document.createElement("a");
    allLink.className = "tab--launch tab--all";
    allLink.textContent = "All lessons";
    allLink.href = "index.html" + (INSTRUCTOR ? "?instructor=1" : "");
    tabsEl.appendChild(allLink);

    // Course-navigation sidebar (data-driven from lessons.json)
    var shell = document.getElementById("shell");
    var courseNav = document.getElementById("courseNav");
    var navTree = document.getElementById("navTree");
    function navHref(value) {
      return "view.html?lesson=" + encodeURIComponent(value) + (INSTRUCTOR ? "&instructor=1" : "");
    }
    function addModuleHeading(title, pillText) {
      var h = document.createElement("p"); h.className = "course-nav__mod"; h.textContent = title;
      if (pillText) {
        var pill = document.createElement("span"); pill.className = "course-nav__pill";
        pill.textContent = pillText; h.appendChild(pill);
      }
      navTree.appendChild(h);
    }
    fetch("lessons.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
      if (!data) { courseNav.style.display = "none"; return; }
      (data.modules || []).forEach(function (m) {
        addModuleHeading(m.title);
        (m.lessons || []).forEach(function (l) {
          var value = m.id + "/" + l.slug;
          var a = document.createElement("a");
          a.href = navHref(value); a.textContent = l.title;
          if (value === LESSON) { a.className = "is-current"; a.setAttribute("aria-current", "page"); }
          navTree.appendChild(a);
        });
      });
      (data.planned || []).forEach(function (m) {
        addModuleHeading(m.title, "Planned");
        var soon = document.createElement("span");
        soon.className = "course-nav__soon"; soon.textContent = "Coming soon";
        navTree.appendChild(soon);
      });
    }).catch(function () { courseNav.style.display = "none"; });

    // Mobile drawer: toggle the sidebar open/closed
    var navToggle = document.getElementById("navToggle");
    var navBackdrop = document.getElementById("navBackdrop");
    function setNav(open) {
      shell.classList.toggle("nav-open", open);
      navToggle.setAttribute("aria-expanded", open ? "true" : "false");
    }
    navToggle.addEventListener("click", function () { setNav(!shell.classList.contains("nav-open")); });
    navBackdrop.addEventListener("click", function () { setNav(false); });
    navTree.addEventListener("click", function (e) { if (e.target.closest("a")) setNav(false); });

    var launch = document.createElement("a");
    launch.className = "tab--launch";
    launch.textContent = "▶ Launch interactive";
    launch.href = LESSON + "/scorm/index.html";
    tabsEl.appendChild(launch);

    function setActive(key) {
      Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function (t) {
        t.classList.toggle("is-active", t.dataset.key === key);
      });
    }

    function load(key) {
      setActive(key);
      contentEl.innerHTML = '<p class="status">Loading…</p>';
      fetch(LESSON + "/" + key + ".md")
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (md) {
          var meta = stripFrontMatter(md);
          contentEl.innerHTML = mdToHtml(meta.body);
          if (meta.title) { document.getElementById("title").textContent = meta.title; }
        })
        .catch(function (e) {
          contentEl.innerHTML = '<p class="status error">Could not load "' + key +
            '.md" (' + e.message + ').<br>Serve this folder with a local web server and reload.</p>';
        });
    }

    // ---- Front matter ----
    function stripFrontMatter(md) {
      var out = { title: null, body: md };
      var m = md.match(/^---\n([\s\S]*?)\n---\n?/);
      if (m) {
        var tm = m[1].match(/^title:\s*"?(.*?)"?\s*$/m);
        if (tm) out.title = tm[1];
        out.body = md.slice(m[0].length);
      }
      return out;
    }

    // ---- Tiny Markdown -> HTML (handles the constructs used in these lessons) ----
    function esc(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function inline(s) {
      s = esc(s);
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      return s;
    }
    function mdToHtml(md) {
      var lines = md.replace(/\r\n/g, "\n").split("\n");
      var html = [], i = 0;
      function isTableSep(l){ return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l) && l.indexOf("-")>-1; }
      while (i < lines.length) {
        var line = lines[i];

        if (/^```/.test(line)) {                       // fenced code
          var buf = []; i++;
          while (i < lines.length && !/^```/.test(lines[i])) { buf.push(esc(lines[i])); i++; }
          i++; html.push("<pre><code>" + buf.join("\n") + "</code></pre>"); continue;
        }
        if (/^#{1,6}\s/.test(line)) {                  // heading
          var h = line.match(/^(#{1,6})\s+(.*)$/);
          var lvl = h[1].length; html.push("<h"+lvl+">"+inline(h[2])+"</h"+lvl+">"); i++; continue;
        }
        if (/^---\s*$/.test(line)) { html.push("<hr>"); i++; continue; }   // hr

        if (line.indexOf("|") > -1 && i+1 < lines.length && isTableSep(lines[i+1])) { // table
          var header = splitRow(line);
          i += 2; var rows = [];
          while (i < lines.length && lines[i].indexOf("|") > -1 && lines[i].trim() !== "") {
            rows.push(splitRow(lines[i])); i++;
          }
          var t = "<table><thead><tr>" + header.map(function(c){return "<th>"+inline(c)+"</th>";}).join("") + "</tr></thead><tbody>";
          rows.forEach(function(r){ t += "<tr>" + r.map(function(c){return "<td>"+inline(c)+"</td>";}).join("") + "</tr>"; });
          t += "</tbody></table>"; html.push(t); continue;
        }
        if (/^>\s?/.test(line)) {                       // blockquote
          var q = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(inline(lines[i].replace(/^>\s?/,""))); i++; }
          html.push("<blockquote>"+q.join("<br>")+"</blockquote>"); continue;
        }
        // A line continues the current list item if it's non-blank and not itself a new
        // list item, heading, blockquote, code fence, hr, or table row.
        function isContinuation(l) {
          return l.trim() !== "" &&
                 !/^\s*(\d+\.|[-*])\s+/.test(l) &&
                 !/^(#{1,6}\s|>\s?|```|---\s*$)/.test(l) &&
                 l.indexOf("|") === -1;
        }
        if (/^\s*[-*]\s+/.test(line)) {                 // unordered list
          var ul = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            var uitem = lines[i].replace(/^\s*[-*]\s+/, ""); i++;
            while (i < lines.length && isContinuation(lines[i])) { uitem += " " + lines[i].trim(); i++; }
            ul.push("<li>" + inline(uitem) + "</li>");
          }
          html.push("<ul>"+ul.join("")+"</ul>"); continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {                // ordered list
          var ol = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            var oitem = lines[i].replace(/^\s*\d+\.\s+/, ""); i++;
            while (i < lines.length && isContinuation(lines[i])) { oitem += " " + lines[i].trim(); i++; }
            ol.push("<li>" + inline(oitem) + "</li>");
          }
          html.push("<ol>"+ol.join("")+"</ol>"); continue;
        }
        if (line.trim() === "") { i++; continue; }      // blank

        var para = [];                                   // paragraph
        while (i < lines.length && lines[i].trim() !== "" &&
               !/^(#{1,6}\s|>\s?|\s*[-*]\s+|\s*\d+\.\s+|```|---\s*$)/.test(lines[i])) {
          para.push(inline(lines[i])); i++;
        }
        html.push("<p>"+para.join(" ")+"</p>");
      }
      return html.join("\n");
    }
    function splitRow(l){
      return l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(function(c){return c.trim();});
    }

    // Boot: open the lesson text
    load("lesson-text");
  })();
  </script>
</body>
</html>
